services:
  - type: web
    name: hugcollect-bot
    runtime: python
    plan: free
    rootDir: HugCollectBot
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: SUPPORT_USERNAME
        value: "@your_support_username"
      - key: PYTHON_VERSION
        value: "3.13.5"
